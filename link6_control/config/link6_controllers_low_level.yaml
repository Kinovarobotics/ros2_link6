controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController


joint_state_broadcaster:
  ros__parameters:
    {}

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position
      - velocity

    state_interfaces:
      - position
      - velocity

    open_loop_control: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      joint_1:
        goal: 0.001
      joint_2:
        goal: 0.001
      joint_3:
        goal: 0.001
      joint_4:
        goal: 0.001
      joint_5:
        goal: 0.001
      joint_6:
        goal: 0.001
        
    gains:
      joint_1:
        p: 3.0
        i: 0.0
        i_clamp: 0.0
        d: 0.3
        ff_velocity_scale: 0.0
      joint_2:
        p: 3.0
        i: 0.0
        i_clamp: 0.0
        d: 0.3
        ff_velocity_scale: 0.0
      joint_3:
        p: 3.0
        i: 0.0
        i_clamp: 0.0
        d: 0.3
        ff_velocity_scale: 0.0
      joint_4:
        p: 3.0
        i: 0.0
        i_clamp: 0.0
        d: 0.3
        ff_velocity_scale: 0.0
      joint_5:
        p: 3.0
        i: 0.0
        i_clamp: 0.0
        d: 0.3
        ff_velocity_scale: 0.0
      joint_6:
        p: 3.0
        i: 0.0
        i_clamp: 0.0
        d: 0.3
        ff_velocity_scale: 0.0

joint_velocity_controller:
  ros__parameters:

    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true